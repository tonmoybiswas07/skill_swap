name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name skillswap-mongo -p 127.0.0.1:27017:27017 mongo:8 mongod --replSet rs0 --bind_ip_all
          timeout 60 bash -c 'until docker exec skillswap-mongo mongosh --quiet --eval "db.adminCommand({ping:1}).ok" >/dev/null 2>&1; do sleep 1; done'
          docker exec skillswap-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          timeout 60 bash -c 'until docker exec skillswap-mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done'
      - run: npm run check
      - run: npm test
      - run: npm run build
